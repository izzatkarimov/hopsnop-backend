services:
  postgres:
    image: postgres:17
    container_name: hopsnop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hopsnop
      POSTGRES_USER: hopsnop
      POSTGRES_PASSWORD: hopsnop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: